name: pages build and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retry 1
        if: steps.d1.outcome == 'failure'
        run: sleep 75
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retry 2
        if: steps.d2.outcome == 'failure'
        run: sleep 75
      - id: d3
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retry 3
        if: steps.d3.outcome == 'failure'
        run: sleep 75
      - id: d4
        if: steps.d3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retry 4
        if: steps.d4.outcome == 'failure'
        run: sleep 75
      - id: d5
        if: steps.d4.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retry 5
        if: steps.d5.outcome == 'failure'
        run: sleep 75
      - id: d6
        if: steps.d5.outcome == 'failure'
        uses: actions/deploy-pages@v4
